<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Print</title>
  <link rel="stylesheet" href="print.css" />
</head>
<body>
  <main id="print-stage" aria-label="print preview">
    <div id="print-layer-bg">
      <div class="print-tile"></div>
      <div class="print-tile"></div>
      <div class="print-tile"></div>
      <div class="print-tile"></div>
      <div class="print-tile"></div>
      <div class="print-tile"></div>
      <div class="print-tile"></div>
      <div class="print-tile"></div>
      <div class="print-tile"></div>
    </div>

    <div id="print-layer-elements"></div>

    <!-- print 화면에서는 가림막이 항상 화면 위를 덮도록 구성 -->
    <div class="print-panel" data-panel="a"></div>
    <div class="print-panel" data-panel="b"></div>
    <div class="print-panel" data-panel="c"></div>
    <div class="print-panel" data-panel="d"></div>
  </main>

  <script src="print.js"></script>
</body>
</html>
