<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <style>
    #fade-in {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.8s ease;
    }
  </style>
  <div id="fade-in"></div>

  <div id="ui-hint">scroll to explore</div>

  <!-- 우측 상단 홈 버튼 -->
  <div id="home-btn" title="home">
    <img src="images/landing.png" alt="home" draggable="false" />
  </div>

  <div id="viewport">
    <!-- 1. 배경 이미지 레이어 -->
    <div id="layer-bg">
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
    </div>

    <!-- 2. 요소 PNG 전체를 얹는 레이어 -->
    <div id="layer-elements"></div>

    <!-- 3. 클릭 영역만 담당하는 투명 레이어 -->
    <div id="layer-mid"></div>
  </div>

  <div class="panel" id="panel-a"></div>
  <div class="panel" id="panel-b"></div>
  <div class="panel" id="panel-c"></div>
  <div class="panel" id="panel-d"></div>

  <script src="main.js"></script>
  <script>
    window.addEventListener('load', () => {
      const fadeIn = document.getElementById('fade-in');
      fadeIn.style.opacity = '0';
      setTimeout(() => fadeIn.remove(), 900);

      document.getElementById('home-btn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
