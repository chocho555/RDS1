<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>사문디 — 무한 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage" aria-label="사문디 무한 평면. 드래그하거나 스크롤하여 둘러보세요.">
    <div id="bg" aria-hidden="true"></div>
    <div id="world" aria-hidden="true"></div>
    <div id="grain" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
  </div>

  <header id="masthead">
    <div class="title-row"><span class="dot"></span><h1>사문디</h1></div>
    <p class="sub">재개발 기록 · Redevelopment Archive</p>
  </header>

  <button id="info-btn" type="button" aria-label="정보 보기">정보</button>

  <div id="hint" role="status"><span class="hint-pulse"></span>드래그 · 스크롤하여 둘러보기</div>

  <aside id="info-panel" hidden>
    <button class="close" type="button" aria-label="닫기">✕</button>
    <h2>사문디 <span>無限</span></h2>
    <p>철거를 앞둔 동네의 골목과 벽, 화분과 트럭. 흩어진 장면들이 어디에도 닿지 않은 채 끝없이 이어집니다.</p>
    <p>배경은 무한히 흐르고, 사진들은 그 위에서 조금씩 다른 속도로 떠다닙니다.</p>
    <ul>
      <li><kbd>드래그</kbd> 어느 방향으로든 이동</li>
      <li><kbd>스크롤</kbd> 위아래·좌우로 이동</li>
      <li><kbd>가만히</kbd> 두면 스스로 흐름</li>
    </ul>
    <p class="credit">Inspired by Joe Hamilton, <em>Indirect Flights</em> (2015).</p>
  </aside>

  <div id="loader"><span></span></div>
  <script src="js/main.js"></script>
</body>
</html>
