<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="ui-hint">scroll to explore</div>
  <div id="ui-coords">0 / 0</div>

  <!-- ① 시야 제한 창 -->
  <div id="viewport">

    <!-- ② 무한 루프 배경 캔버스 -->
    <div id="canvas">
      <!--
        3×3 타일 배치
        left = 열번호 × 33.333%
        top  = 행번호 × 33.333%
      -->
      <div class="tile" style="left:0%;       top:0%"></div>
      <div class="tile" style="left:33.3334%; top:0%"></div>
      <div class="tile" style="left:66.6667%; top:0%"></div>

      <div class="tile" style="left:0%;       top:33.3334%"></div>
      <div class="tile" style="left:33.3334%; top:33.3334%"></div>
      <div class="tile" style="left:66.6667%; top:33.3334%"></div>

      <div class="tile" style="left:0%;       top:66.6667%"></div>
      <div class="tile" style="left:33.3334%; top:66.6667%"></div>
      <div class="tile" style="left:66.6667%; top:66.6667%"></div>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
