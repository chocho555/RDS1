<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="ui-hint">scroll to explore</div>

  <div id="viewport">

    <!-- 레이어 0: 배경 (speed 0.2) — 가장 느림 -->
    <div id="layer-bg">
      <div class="tile" style="left:0%;       top:0%"></div>
      <div class="tile" style="left:33.3334%; top:0%"></div>
      <div class="tile" style="left:66.6667%; top:0%"></div>
      <div class="tile" style="left:0%;       top:33.3334%"></div>
      <div class="tile" style="left:33.3334%; top:33.3334%"></div>
      <div class="tile" style="left:66.6667%; top:33.3334%"></div>
      <div class="tile" style="left:0%;       top:66.6667%"></div>
      <div class="tile" style="left:33.3334%; top:66.6667%"></div>
      <div class="tile" style="left:66.6667%; top:66.6667%"></div>
    </div>

    <!-- 레이어 1: 요소2 사진들 (speed 0.6) — 중간 -->
    <div id="layer-mid">
      <div class="mid-tile" style="left:0%;       top:0%"></div>
      <div class="mid-tile" style="left:33.3334%; top:0%"></div>
      <div class="mid-tile" style="left:66.6667%; top:0%"></div>
      <div class="mid-tile" style="left:0%;       top:33.3334%"></div>
      <div class="mid-tile" style="left:33.3334%; top:33.3334%"></div>
      <div class="mid-tile" style="left:66.6667%; top:33.3334%"></div>
      <div class="mid-tile" style="left:0%;       top:66.6667%"></div>
      <div class="mid-tile" style="left:33.3334%; top:66.6667%"></div>
      <div class="mid-tile" style="left:66.6667%; top:66.6667%"></div>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
