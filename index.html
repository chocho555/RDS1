<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slit Scroll Visual</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="flip-scene">
    <div class="flip-card">

      <section class="front">
        <main class="scene">
          <div class="slit-wrapper">
            <div class="slit">
              <img id="slitImage" src="images/img1.jpg" alt="changing image" />
            </div>
          </div>

          <div class="panel left"></div>
          <div class="panel right"></div>
        </main>
      </section>

      <section class="back">
        <div class="back-content">
          <h1>Back Side</h1>
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
