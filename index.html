<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Courier New', monospace;
    }

    #enter {
      position: absolute;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%);
      width: 50px;
      cursor: pointer;
    }

    #enter img {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 99;
    }

    #overlay.active {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>
<body>

  <div id="overlay"></div>

  <div id="enter" title="enter">
    <img src="images/landing.png" alt="enter" draggable="false" />
  </div>

  <script>
    const enter   = document.getElementById('enter');
    const overlay = document.getElementById('overlay');

    enter.addEventListener('click', () => {
      overlay.classList.add('active');
      setTimeout(() => {
        window.location.href = 'main.html';
      }, 650);
    });
  </script>
</body>
</html>
